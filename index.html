<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ankosha Banerjee – Interactive Art Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #fafafa;
      color: #333;
    }
    header {
      text-align: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, #f6d365, #fda085);
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .art-item {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      position: relative;
    }
    .art-item:hover {
      transform: translateY(-8px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
    .art-item img {
      width: 100%;
      display: block;
      transition: transform 0.3s;
    }
    .art-item:hover img {
      transform: scale(1.05);
    }
    .details {
      padding: 10px;
      font-size: 0.9rem;
      text-align: center;
    }
    .artist {
      font-weight: bold;
      margin-bottom: 5px;
    }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #lightbox img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #lightbox .caption {
      margin-top: 10px;
      color: white;
      text-align: center;
    }
    .closeBtn {
      position: absolute;
      top: 20px; right: 30px;
      font-size: 30px;
      color: white;
      cursor: pointer;
    }

    /* Members Area */
    #membersModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }
    #membersModal .content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      text-align: center;
    }

    /* Treasure Hunt */
    #treasureHint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <header>🎨 Ankosha Banerjee – Interactive Art Gallery</header>

  <div class="gallery" id="gallery"></div>

  <!-- Lightbox -->
  <div id="lightbox">
    <span class="closeBtn" id="closeBtn">&times;</span>
    <img id="lightboxImage" src="">
    <div class="caption" id="lightboxCaption"></div>
  </div>

  <!-- Treasure Hunt Hint -->
  <div id="treasureHint"></div>

  <!-- Members Area -->
  <div id="membersModal">
    <div class="content">
      <h2>Exclusive Content</h2>
      <p>Welcome to the private studio tour of Ankosha Banerjee.</p>
      <p>Here you can see behind-the-scenes sketches and unreleased works.</p>
      <button onclick="closeMembers()">Close</button>
    </div>
  </div>

  <script>
    const artworks = [
      {
        src: "https://i.imgur.com/q6Qn6oA.png",
        title: "Dreamscape",
        desc: "A surreal journey through imagination and wonder.",
      },
      {
        src: "https://i.imgur.com/DWMLUbM.png",
        title: "Silent Forest",
        desc: "Where whispers of nature meet stillness.",
      },
      {
        src: "https://i.imgur.com/6793z3q.jpeg",
        title: "Golden Hour",
        desc: "Capturing the fleeting glow of sunset.",
      },
      {
        src: "https://i.imgur.com/7UBgfWm.jpeg",
        title: "Reflections",
        desc: "A mirror between inner and outer worlds.",
      },
      {
        src: "https://i.imgur.com/eQjGFOC.jpeg",
        title: "The Wanderer",
        desc: "Exploring paths less traveled.",
      },
      {
        src: "https://i.imgur.com/195ztuL.jpeg",
        title: "Ocean’s Lullaby",
        desc: "Waves that sing you into calmness.",
      },
      {
        src: "https://i.imgur.com/vJHIMH6.jpeg",
        title: "Urban Pulse",
        desc: "The rhythm and chaos of city life.",
      },
      {
        src: "https://i.imgur.com/CHxpq2X.jpeg",
        title: "Blossom Dreams",
        desc: "When spring whispers hope.",
      },
      {
        src: "https://i.imgur.com/Erbvdpx.jpeg",
        title: "Cosmic Dance",
        desc: "Stars twirling in eternal harmony.",
      },
      {
        src: "https://i.imgur.com/tFLuIL1.jpeg",
        title: "Hidden Light",
        desc: "Finding brightness in the darkest corners.",
      }
    ];

    const gallery = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const closeBtn = document.getElementById("closeBtn");
    const treasureHint = document.getElementById("treasureHint");

    let currentIndex = 0;
    let huntActive = true;
    let huntTarget = 2; // Example: the 3rd painting is the treasure

    function loadGallery() {
      artworks.forEach((art, index) => {
        const item = document.createElement("div");
        item.className = "art-item";

        const img = document.createElement("img");
        img.src = art.src;
        img.alt = art.title;

        const details = document.createElement("div");
        details.className = "details";
        details.innerHTML = `
          <div class="artist">Ankosha Banerjee</div>
          <div><strong>${art.title}</strong></div>
          <div>${art.desc}</div>
        `;

        img.onclick = () => showLightbox(index);

        item.appendChild(img);
        item.appendChild(details);
        gallery.appendChild(item);
      });

      if (huntActive) {
        treasureHint.style.display = "block";
        treasureHint.textContent = "🔎 Treasure Hunt: Find the artwork called 'Golden Hour'!";
      }
    }

    function showLightbox(index) {
      currentIndex = index;
      lightboxImage.src = artworks[index].src;
      lightboxCaption.innerHTML = `<strong>${artworks[index].title}</strong><br>${artworks[index].desc}<br><em>by Ankosha Banerjee</em>`;
      lightbox.style.display = "flex";

      if (huntActive && index === huntTarget) {
        treasureHint.textContent = "🎉 You found the treasure! Exclusive content unlocked!";
        openMembers();
        huntActive = false;
      }
    }

    function hideLightbox() {
      lightbox.style.display = "none";
    }

    closeBtn.onclick = hideLightbox;
    lightbox.onclick = (e) => { if (e.target === lightbox) hideLightbox(); };

    // Members modal
    function openMembers() {
      document.getElementById("membersModal").style.display = "flex";
    }
    function closeMembers() {
      document.getElementById("membersModal").style.display = "none";
    }

    loadGallery();
  </script>
</body>
    </html>
